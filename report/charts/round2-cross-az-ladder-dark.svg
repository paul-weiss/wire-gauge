<svg viewBox="0 0 960 332" role="img" aria-label="p50 to p999 round-trip latency per backend, log scale" xmlns="http://www.w3.org/2000/svg" width="960" height="332"><style>.grid{stroke:#3a3936;stroke-width:1}.axis{fill:#c3c2b7;font:11px 'IBM Plex Mono',ui-monospace,Menlo,monospace}.rowlabel{fill:#ffffff;font:12.5px 'IBM Plex Mono',ui-monospace,Menlo,monospace}.value{fill:#c3c2b7;font:11px 'IBM Plex Mono',ui-monospace,Menlo,monospace}.title{fill:#ffffff;font:600 14px 'IBM Plex Sans',system-ui,sans-serif}.sub{fill:#c3c2b7;font:11.5px 'IBM Plex Sans',system-ui,sans-serif}</style><rect width="960" height="332" fill="#1a1a19" rx="8"/><text class="title" x="16" y="20">Across the wire, across availability zones</text><text class="sub" x="16" y="36">Round trip, p50 → p99 → p99.9, log scale; each backend at its lowest unsaturated offered rate; ICMP floor avg 1.4 ms</text><g transform="translate(0 44)"><line class="grid" x1="120.0" y1="16" x2="120.0" y2="254"/><text class="axis" x="120.0" y="270" text-anchor="middle">100 µs</text><line class="grid" x1="520.0" y1="16" x2="520.0" y2="254"/><text class="axis" x="520.0" y="270" text-anchor="middle">1.0 ms</text><line class="grid" x1="920.0" y1="16" x2="920.0" y2="254"/><text class="axis" x="920.0" y="270" text-anchor="middle">10.0 ms</text><g><title>aeron-udp @ 5k/s: p50 1.1 ms, p99 1.3 ms, p999 1.4 ms, max 1.5 ms, drops 0</title><text class="rowlabel" x="110" y="37.0" text-anchor="end">aeron-udp</text><line x1="539.1" y1="33.0" x2="575.4" y2="33.0" style="stroke:#d95926" stroke-width="2"/><circle cx="575.4" cy="33.0" r="3.5" style="fill:#d95926" opacity="0.45"/><circle cx="565.5" cy="33.0" r="3.5" style="fill:#d95926" opacity="0.7"/><circle cx="539.1" cy="33.0" r="5" style="fill:#d95926;stroke:#1a1a19" stroke-width="2"/><text class="value" x="530.1" y="37.0" text-anchor="end">1.1 ms</text></g><g><title>tcp @ 5k/s: p50 1.3 ms, p99 1.7 ms, p999 1.8 ms, max 1.8 ms, drops 0</title><text class="rowlabel" x="110" y="71.0" text-anchor=